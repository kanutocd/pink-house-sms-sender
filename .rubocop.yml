plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Minitest/MultipleAssertions:
  Max: 5

Metrics/AbcSize:
  Exclude:
    - "test/sms/test_delivery.rb"
    - "test/sms/test_provider_registry.rb"
    - "lib/sms/sender/http.rb"
    - "test/sms/test_http.rb"
    - "test/sms/test_text_bee.rb"

Metrics/MethodLength:
  Exclude:
    - "test/sms/test_delivery.rb"
    - "test/sms/test_message.rb"
    - "test/sms/test_provider_configuration.rb"
    - "test/sms/test_provider_registry.rb"
    - "lib/sms/sender/http.rb"
    - "test/sms/test_http.rb"
    - "lib/sms/sender/providers/text_bee.rb"
    - "test/sms/test_text_bee.rb"

Metrics/ParameterLists:
  Exclude:
    - "lib/sms/sender/delivery.rb"
    - "lib/sms/sender/http.rb"

Metrics/ClassLength:
  Exclude:
    - "test/sms/test_http.rb"
