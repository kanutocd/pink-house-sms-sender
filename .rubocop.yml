plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Minitest/MultipleAssertions:
  Max: 5

Metrics/AbcSize:
  Exclude:
    - "test/sms/test_delivery.rb"
    - "test/sms/test_provider_registry.rb"
    - "lib/sms/sender/http.rb"
    - "test/sms/test_http.rb"
    - "test/sms/test_text_bee.rb"
    - "lib/sms/sender.rb"
    - "test/sms/test_sender_api.rb"
    - "lib/sms/sender/providers/semaphore.rb"
    - "test/sms/test_semaphore.rb"
    - "lib/sms/sender/providers/infobip.rb"
    - "test/sms/test_infobip.rb"
    - "test/sms/test_router.rb"
    - "test/sms/test_state_store.rb"
    - "lib/sms/sender/router.rb"

Metrics/MethodLength:
  Exclude:
    - "test/sms/test_delivery.rb"
    - "test/sms/test_message.rb"
    - "test/sms/test_provider_configuration.rb"
    - "test/sms/test_provider_registry.rb"
    - "lib/sms/sender/http.rb"
    - "test/sms/test_http.rb"
    - "lib/sms/sender/providers/text_bee.rb"
    - "test/sms/test_text_bee.rb"
    - "lib/sms/sender.rb"
    - "test/sms/test_sender_api.rb"
    - "lib/sms/sender/providers/semaphore.rb"
    - "test/sms/test_semaphore.rb"
    - "lib/sms/sender/providers/infobip.rb"
    - "test/sms/test_infobip.rb"
    - "test/sms/test_router.rb"
    - "lib/sms/sender/router.rb"

Metrics/CyclomaticComplexity:
  Exclude:
    - "lib/sms/sender/providers/infobip.rb"
    - "lib/sms/sender/router.rb"

Metrics/ParameterLists:
  Exclude:
    - "lib/sms/sender/delivery.rb"
    - "lib/sms/sender/http.rb"

Metrics/PerceivedComplexity:
  Exclude:
    - "lib/sms/sender/router.rb"

Metrics/BlockLength:
  Exclude:
    - "lib/sms/sender/router.rb"
    - "sms-sender.gemspec"

Metrics/ClassLength:
  Exclude:
    - "test/sms/test_http.rb"
    - "test/sms/test_router.rb"
    - "lib/sms/sender/router.rb"
